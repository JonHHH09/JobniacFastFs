name: End-to-end

# WebDriver suite of the desktop workflows (e2e/README.md). It runs the debug desktop build through
# tauri-driver on Windows (msedgedriver matching the WebView2 runtime) and Linux (WebKitWebDriver
# under xvfb), over a temporary SQLite database file.
#
# Reusable: release.yml calls this workflow (job `e2e`) on the merge commit of a promotion pull
# request with `release-call: true`, which runs the full set, Windows included.
#
# Cost control, as in ci.yml: the `changes` job path-filters pull requests into development and skips
# everything for a tree that already passed on a trusted run (a push or the nightly dispatch on
# development, or a promotion pull request); a promotion pull request and the release call run
# everything, the Windows job does not run on other pull requests; `mark-passed` records a fully
# green run of those kinds. There is no push run for main. Pull requests restore the Rust caches but
# never save them (`save-if`). The two platform jobs are plain jobs with literal names (a skipped
# matrix job would report an unexpanded name).

on:
  push:
    branches: [development]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-call:
        description: "Called by release.yml on the promotion merge commit: test that commit and run the full set."
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes and the release call (a merged pull request) never cancel.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged != true }}

env:
  CARGO_TERM_COLOR: always
  # Faster compile and link; backtraces keep function names, only line numbers are dropped.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions cache list for the passed marker (scripts/ci/gate.sh).
      actions: read
      # Reads a pull request to verify a promotion pull request marker (scripts/ci/gate.sh).
      pull-requests: read
    outputs:
      tree: ${{ steps.gate.outputs.tree }}
      already-passed: ${{ steps.gate.outputs.already-passed }}
      app: ${{ steps.gate.outputs.app }}
      windows: ${{ steps.gate.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request checks out the merge commit; depth 2 reaches its first parent (the base).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - name: Decide which jobs run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # The gate's name for the release call: a full run, no path filtering.
          RELEASE_CALL: ${{ inputs.release-call }}
        run: bash scripts/ci/gate.sh e2e

  e2e-linux:
    name: E2E (ubuntu-26.04)
    needs: changes
    # Fail open: when the gate itself did not succeed, run (a skipped required check counts as passed).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-suite
        with:
          platform: ubuntu-26.04

  e2e-windows:
    name: E2E (windows-latest)
    needs: changes
    # Not on pull requests: the gate turns `windows` off for them (a failed gate runs it anyway).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.windows == 'true' && needs.changes.outputs.app == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-suite
        with:
          platform: windows-latest

  # Records that this tree passed both platforms. Saved by pushes and dispatches on development or
  # main (scoped to that branch) and by a promotion pull request (scoped to refs/pull/<n>/merge,
  # which the gate verifies through the API); never by the release call. `success()` is false when
  # a needed job was skipped, so a marker always means that both jobs ran and passed.
  mark-passed:
    name: Mark tree as passed
    needs: [changes, e2e-linux, e2e-windows]
    if: >-
      ${{ success()
      && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'pull_request' && !inputs.release-call
      && github.base_ref == 'main' && github.head_ref == 'development'
      && github.event.pull_request.head.repo.full_name == github.repository))
      && needs.changes.outputs.already-passed != 'true'
      && needs.e2e-linux.result == 'success'
      && needs.e2e-windows.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Write the marker file
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" > passed-marker
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passed-marker
          key: e2e-passed-${{ needs.changes.outputs.tree }}
