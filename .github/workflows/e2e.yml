name: End-to-end

# WebDriver suite of the desktop workflows (e2e/README.md). It runs the debug desktop build through
# tauri-driver on Windows (msedgedriver matching the WebView2 runtime) and Linux (WebKitWebDriver
# under xvfb), over a temporary SQLite database file.
#
# Reusable: release.yml calls this workflow (job `e2e`) on the merge commit of a promotion pull
# request with `release-call: true`, which runs the full set, Windows included. Its `scope` input
# (all, shared, linux, macos, windows) turns every job outside the scope off; empty means all.
#
# Cost control, as in ci.yml: the `changes` job (scripts/ci/gate.sh) path-filters plain pull requests
# by change class (scripts/ci/change_classes.toml; plain means neither the release call nor a promotion
# pull request, so a pull request into main from another branch is plain too) and skips a platform job
# whose tree already passed it on a trusted run (a push or the nightly dispatch on development, or a
# promotion pull request). Pushes, manual runs, promotion pull requests and the release call run both
# platforms; Windows also runs on plain pull requests whose classes need the app. `mark-passed` saves
# one marker per platform job that ran and succeeded (`e2e-passed-linux-<tree>`,
# `e2e-passed-windows-<tree>`). There is no push run for main. Pull requests restore the Rust caches
# but never save them (`save-if`). `E2E result` is the required check: it always runs and fails unless
# both platform jobs succeeded or were skipped. The two platform jobs are plain jobs with literal names
# (a skipped matrix job would report an unexpanded name).

on:
  push:
    branches: [development]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-call:
        description: "Called by release.yml on the promotion merge commit: test that commit and run the full set."
        type: boolean
        default: false
      scope:
        description: "Which jobs the release call runs: all, shared (none here), linux, macos (none here) or windows. Empty means all."
        type: string
        default: all

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes and the release call (a merged pull request) never cancel.
concurrency:
  # The scope is in the group: release.yml calls this workflow once per scope in one run, and the calls
  # must not queue or cancel each other.
  group: e2e-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged != true }}

env:
  CARGO_TERM_COLOR: always
  # Faster compile and link; backtraces keep function names, only line numbers are dropped.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions cache list for the passed marker (scripts/ci/gate.sh).
      actions: read
      # Reads a pull request to verify a promotion pull request marker (scripts/ci/gate.sh).
      pull-requests: read
    outputs:
      tree: ${{ steps.gate.outputs.tree }}
      e2e-linux: ${{ steps.gate.outputs.e2e-linux }}
      e2e-windows: ${{ steps.gate.outputs.e2e-windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request checks out the merge commit; depth 2 reaches its first parent (the base).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - name: Decide which jobs run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # With BASE_REF and the repository, tells a promotion pull request from a plain one.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # The gate's name for the release call: a full run, no path filtering.
          RELEASE_CALL: ${{ inputs.release-call }}
          SCOPE: ${{ inputs.scope }}
        run: bash scripts/ci/gate.sh e2e

  e2e-linux:
    name: E2E (ubuntu-26.04)
    needs: changes
    # Fail open: when the gate itself did not succeed, run (a skipped required check counts as passed).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e-linux == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-suite
        with:
          platform: ubuntu-26.04

  e2e-windows:
    name: E2E (windows-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e-windows == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/e2e-suite
        with:
          platform: windows-latest

  # Records which platform jobs passed on this tree: one marker per job (`e2e-passed-<platform>-<tree>`),
  # saved for each job that ran and succeeded in this run (a skipped job saves nothing). Saved by
  # pushes and dispatches on development or main (scoped to that branch) and by a promotion pull
  # request (scoped to refs/pull/<n>/merge, which the gate verifies through the API); never by the
  # release call. A failed gate saves nothing: its jobs ran fail-open.
  mark-passed:
    name: Mark tree as passed
    needs: [changes, e2e-linux, e2e-windows]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'pull_request' && !inputs.release-call
      && github.base_ref == 'main' && github.head_ref == 'development'
      && github.event.pull_request.head.repo.full_name == github.repository))
      && (needs.e2e-linux.result == 'success'
      || needs.e2e-windows.result == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Write the marker file
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" > passed-marker
      - name: Save the marker of the Linux job
        if: ${{ needs.e2e-linux.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passed-marker
          key: e2e-passed-linux-${{ needs.changes.outputs.tree }}
      - name: Save the marker of the Windows job
        if: ${{ needs.e2e-windows.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passed-marker
          key: e2e-passed-windows-${{ needs.changes.outputs.tree }}

  # The required check. It runs always (`always()`: a skipped required check counts as passed, so a
  # cancelled or failed dependency must never leave it skipped) and fails unless every needed job
  # succeeded or was skipped. A failed `changes` job fails it, although the platform jobs then run
  # fail-open. No checkout: bash and jq are on the runner.
  result:
    name: E2E result
    needs: [changes, e2e-linux, e2e-windows]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the results of the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "### E2E result"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
