name: End-to-end

# WebDriver suite of the desktop workflows (e2e/README.md). It runs the debug desktop build through
# tauri-driver on Windows (msedgedriver matching the WebView2 runtime) and Linux (WebKitWebDriver
# under xvfb), over a disposable PostgreSQL 18 cluster started by pg-run.
#
# Cost control, as in ci.yml: the `changes` job path-filters pull requests and skips everything for a
# tree that already passed on a push to development or main; the Windows job runs on pushes and manual
# runs, not on pull requests; `mark-passed` records a fully green push run. The two platform jobs are
# plain jobs with literal names (a skipped matrix job would report an unexpanded name).

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Faster compile and link; backtraces keep function names, only line numbers are dropped.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions cache list for the passed marker (scripts/ci/gate.sh).
      actions: read
    outputs:
      tree: ${{ steps.gate.outputs.tree }}
      already-passed: ${{ steps.gate.outputs.already-passed }}
      app: ${{ steps.gate.outputs.app }}
      windows: ${{ steps.gate.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request checks out the merge commit; depth 2 reaches its first parent (the base).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false
      - name: Decide which jobs run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash scripts/ci/gate.sh e2e

  e2e-linux:
    name: E2E (ubuntu-24.04)
    needs: changes
    # Fail open: when the gate itself did not succeed, run (a skipped required check counts as passed).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-suite
        with:
          platform: ubuntu-24.04

  e2e-windows:
    name: E2E (windows-latest)
    needs: changes
    # Not on pull requests: the gate turns `windows` off for them (a failed gate runs it anyway).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.windows == 'true' && needs.changes.outputs.app == 'true')) }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/e2e-suite
        with:
          platform: windows-latest

  # Records that this tree passed both platforms. Saved on pushes only, so the cache is scoped to
  # development or main, which is what the gate trusts. `success()` is false when a needed job was
  # skipped, so a marker always means that both jobs ran and passed.
  mark-passed:
    name: Mark tree as passed
    needs: [changes, e2e-linux, e2e-windows]
    if: >-
      ${{ success() && github.event_name == 'push'
      && needs.changes.outputs.already-passed != 'true'
      && needs.e2e-linux.result == 'success'
      && needs.e2e-windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write the marker file
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" > passed-marker
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed-marker
          key: e2e-passed-${{ needs.changes.outputs.tree }}
