name: Release

# Draft-first release. Runs once a promotion pull request from development into main is
# merged in this repository. It creates a draft and never publishes: publication is a manual step
# after the owner has checked the artifacts, the notices and the draft body.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.merge_commit_sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
  RELEASE_OUT: release-out

jobs:
  # 1. Every CI and E2E gate on the merge commit. ci.yml and e2e.yml declare `workflow_call` with the
  #    input `release-call`, which runs the full set there. Both skip the work when the promotion pull
  #    request already passed them on this exact tree.
  checks:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml
    # The called workflow cannot hold more than its caller grants: its `changes` job reads the
    # Actions cache list to find the passed marker of this tree, and the pull request that saved it.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      release-call: true

  # The end-to-end suite on the merge commit, on Linux and Windows, called like `checks`.
  e2e:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e.yml
    # Same reason as `checks`: the called `changes` job reads the Actions cache list.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      release-call: true

  # 2. Read-only: checks out MERGE_SHA, asserts HEAD and resolves the version intent.
  prepare:
    needs: [checks, e2e]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check that HEAD is the merge commit
        run: python -I scripts/release/release.py check-checkout --merge-sha "$MERGE_SHA"
      - name: Resolve the version intent (three fields must agree)
        id: resolve
        run: python -I scripts/release/release.py resolve-version

  # 3. The only write step that creates the draft. The build legs attach to it by ID.
  draft:
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Tag precheck, prune stale Windows installers, create or reuse the single draft
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -I scripts/release/release.py draft
          --repo "$GITHUB_REPOSITORY" --merge-sha "$MERGE_SHA"

  # 4. Builds, one leg per platform. tauri-action attaches to the draft; the token is passed to that
  #    step only. The unsigned NSIS installer (Windows) and AppImage and deb (Linux, x86-64) are built.
  build:
    needs: [prepare, draft]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            bundles: nsis
            library: pdfium.dll
          # Not the latest LTS like the other jobs: the build host sets the glibc floor of the
          # AppImage and deb, so 24.04 keeps them running on Ubuntu 24.04 and newer.
          - os: ubuntu-24.04
            platform: linux-x64
            bundles: appimage,deb
            library: libpdfium.so
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Linux system packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check that HEAD is the merge commit
        run: python -I scripts/release/release.py check-checkout --merge-sha "$MERGE_SHA"
      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show
      - name: Fetch the pinned PDFium binaries (both platforms, for the notices)
        if: runner.os == 'Linux'
        run: bash scripts/fetch-pdfium.sh all
      - name: Fetch the pinned PDFium binaries (both platforms, for the notices)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1 -Platform all
      - name: Install the release tools (versions pinned)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/tools"
          cargo install --locked --root "$TOOLS" --version 0.9.2 --features cli cargo-about
          cargo install --locked --root "$TOOLS" --version 0.5.9 cargo-cyclonedx
          cargo install --locked --root "$TOOLS" --version 0.7.7 cargo-auditable
          cargo install --locked --root "$TOOLS" --version 0.22.1 --features binary-scanning cargo-audit
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          # tauri-action runs `tauri build`, which runs `cargo build` directly, so `cargo auditable` is not
          # used there. Cargo's workspace wrapper hook does the same job: cargo-auditable answers as the
          # rustc wrapper when RUSTC_WORKSPACE_WRAPPER names it (see the tauri-action step below).
          SUFFIX=""
          if [ "$RUNNER_OS" = "Windows" ]; then SUFFIX=".exe"; fi
          echo "JOBNIAC_AUDITABLE_WRAPPER=$TOOLS/bin/cargo-auditable$SUFFIX" >> "$GITHUB_ENV"
      - name: Frontend build (the desktop crate embeds it)
        run: pnpm build
      - name: Licence notices (cargo-about, pnpm licences, static components)
        run: >-
          python -I scripts/release/release.py notices
          --out-dir src-tauri/resources
          --pdfium-dir vendor/pdfium/windows-x64
          --pdfium-dir vendor/pdfium/linux-x64
      - name: Build the CLI with cargo auditable and stage the sidecar
        run: |
          set -euo pipefail
          cargo auditable build --release --locked -p jobniac-cli
          python -I scripts/release/release.py stage-sidecar --target-dir target/release --binaries-dir src-tauri/binaries
      - name: Build and attach the draft assets (tauri-action, the only step with the token)
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Makes the desktop binary auditable: cargo-auditable is the workspace rustc wrapper for this build.
          RUSTC_WORKSPACE_WRAPPER: ${{ env.JOBNIAC_AUDITABLE_WRAPPER }}
          CARGO_AUDITABLE_ORIG_ARGS: '{"config":[],"offline":false,"locked":true,"frozen":false}'
        with:
          projectPath: .
          tagName: ${{ env.TAG }}
          releaseId: ${{ needs.draft.outputs.release_id }}
          releaseDraft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
      - name: Audit the built binaries (embedded cargo-auditable data is required)
        run: |
          set -euo pipefail
          SUFFIX=""
          if [ "$RUNNER_OS" = "Windows" ]; then SUFFIX=".exe"; fi
          LOG="$RUNNER_TEMP/cargo-audit-bin.log"
          for bin in "target/release/jobniac$SUFFIX" "target/release/jobniac-cli$SUFFIX"; do
            cargo audit bin "$bin" 2>&1 | tee -a "$LOG"
          done
          # cargo audit bin only warns when the data is missing (the message wraps inside 'cargo auditable'),
          # so the warning is the gate.
          if grep -Fq "was not built with '" "$LOG"; then
            echo "::error::a built binary has no cargo-auditable data" >&2
            exit 1
          fi
      - name: Stage the payload and reconcile it with the notices
        run: |
          set -euo pipefail
          SUFFIX=""
          if [ "$RUNNER_OS" = "Windows" ]; then SUFFIX=".exe"; fi
          mkdir -p "$RELEASE_OUT"
          python -I scripts/release/release.py stage-payload \
            --target-dir target/release --platform "$PLATFORM" \
            --pdfium-library "vendor/pdfium/$PLATFORM/${{ matrix.library }}" \
            --notices src-tauri/resources/THIRD-PARTY-NOTICES.txt \
            --out "$RUNNER_TEMP/payload"
          python -I scripts/release/release.py inventory \
            --payload "$RUNNER_TEMP/payload" \
            --notices-manifest src-tauri/resources/notices-manifest.json \
            --out "$RELEASE_OUT/JobniacFast-$VERSION-$PLATFORM.payload-inventory.json"
      - name: Software bill of materials (Linux leg only; recomputed and compared byte for byte)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          SBOM="$RUNNER_TEMP/sbom"
          mkdir -p "$SBOM/first" "$SBOM/second"
          for run in first second; do
            cargo cyclonedx --format json --spec-version 1.5 --target all --all --manifest-path src-tauri/Cargo.toml -q
            mv src-tauri/jobniac-desktop.cdx.json "$SBOM/$run/desktop.cdx.json"
            cargo cyclonedx --format json --spec-version 1.5 --target all --all --manifest-path crates/cli/Cargo.toml -q
            mv crates/cli/jobniac-cli.cdx.json "$SBOM/$run/cli.cdx.json"
            pnpm sbom --sbom-format cyclonedx --sbom-spec-version 1.5 --prod --out "$SBOM/$run/npm.cdx.json"
          done
          for role in desktop cli; do
            python -I scripts/release/release.py normalize-sbom --in "$SBOM/first/$role.cdx.json" --out "$SBOM/first/$role.norm.json" --seed "v$VERSION|$MERGE_SHA|$role"
            python -I scripts/release/release.py normalize-sbom --in "$SBOM/second/$role.cdx.json" --out "$SBOM/second/$role.norm.json" --seed "v$VERSION|$MERGE_SHA|$role"
            cmp "$SBOM/first/$role.norm.json" "$SBOM/second/$role.norm.json"
            cp "$SBOM/first/$role.norm.json" "$RELEASE_OUT/JobniacFast-$VERSION-$role.cargo.cdx.json"
          done
          python -I scripts/release/release.py normalize-sbom --in "$SBOM/first/npm.cdx.json" --out "$SBOM/first/npm.norm.json" --seed "v$VERSION|$MERGE_SHA|npm"
          python -I scripts/release/release.py normalize-sbom --in "$SBOM/second/npm.cdx.json" --out "$SBOM/second/npm.norm.json" --seed "v$VERSION|$MERGE_SHA|npm"
          cmp "$SBOM/first/npm.norm.json" "$SBOM/second/npm.norm.json"
          cp "$SBOM/first/npm.norm.json" "$RELEASE_OUT/JobniacFast-$VERSION.npm.cdx.json"
      - name: Collect the installer, the notices and the leg digests
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_OUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/release/bundle/nsis/JobniacFast_${VERSION}_x64-setup.exe" "$RELEASE_OUT/"
          else
            cp "target/release/bundle/appimage/JobniacFast_${VERSION}_amd64.AppImage" "$RELEASE_OUT/"
            cp "target/release/bundle/deb/JobniacFast_${VERSION}_amd64.deb" "$RELEASE_OUT/"
          fi
          cp src-tauri/resources/THIRD-PARTY-NOTICES.txt "$RELEASE_OUT/"
          python -I scripts/release/release.py leg-digests --dir "$RELEASE_OUT"
      - name: Upload the leg artifacts (workflow artifacts, not the draft)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.RELEASE_OUT }}/*
          if-no-files-found: error
          retention-days: 30

  # 5. Installs the Windows installer on a fresh runner, from the workflow artifact, before attach.
  clean-machine:
    needs: [prepare, build]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-x64
          path: legs/windows-x64
      - name: Install, launch, exercise MCP, uninstall and check residue
        run: >-
          python -I scripts/release/clean_machine_smoke.py
          --installer "legs/windows-x64/JobniacFast_${VERSION}_x64-setup.exe"
          --leg-digests legs/windows-x64/leg-digests.txt
          --inventory "legs/windows-x64/JobniacFast-${VERSION}-windows-x64.payload-inventory.json"
          --version "$VERSION"
          --work "$RUNNER_TEMP/clean-machine"

  # 6. Verifies the legs, assembles the exact asset set, writes SHA256SUMS and attaches what the draft lacks.
  attach:
    needs: [prepare, draft, build, clean-machine]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: legs
      - name: Assemble the asset set and write SHA256SUMS (write, then verify)
        run: python -I scripts/release/release.py assemble --legs legs --out release-assets --version "$VERSION"
      - name: Attach the missing assets to the draft (same name and digest only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -I scripts/release/release.py attach
          --repo "$GITHUB_REPOSITORY" --release-id "${{ needs.draft.outputs.release_id }}"
          --dir release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  # 7. Build provenance, only for a public repository (GitHub refuses it for user-owned private ones).
  #    The permissions sit on this job because a job cannot grant them conditionally.
  attest:
    needs: [attach]
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

  # 8. Final API check of the draft: tag peel, flags, target commit, exact asset set and digests.
  verify-draft:
    needs: [prepare, attach]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Verify the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -I scripts/release/release.py verify-draft
          --repo "$GITHUB_REPOSITORY" --merge-sha "$MERGE_SHA" --dir release-assets
