name: Release

# Draft-first release. Runs once a promotion pull request from development into main is
# merged in this repository. It creates a draft, builds and verifies it, and only the last job
# (`publish`) tags the merge commit and publishes the draft, after every other job has passed.
# A stable version becomes the latest release (the one the in-app updater reads); a -dev.N
# version is published as a prerelease and never as the latest.
#
# The version is computed, never committed (main and development are PR-only): the `prepare` job takes
# the patch after the highest stable `v*` tag, or the version in the files when a manual bump on
# development set a higher, untagged one (a minor, major or -dev.N floor). The build legs stamp that
# version into their checkout (`set-version`), so nothing is pushed to any branch.
#
# The same workflow also runs as a dry run on the OPEN promotion pull request (opened, a push to
# development, reopened). A pull request run uses the workflow file of its merge ref, so a release fix
# that sits on development is exercised here before the promotion merges, not by the merge itself. The
# dry run builds on the pull request's merge ref (the tree that the merge will produce), signs the
# updater artifacts with the real key (a same-repository pull request from the protected development
# branch is the only one that gets it, and it is what proves a key rotation), builds the macOS leg
# ad-hoc (no Apple secret), runs both clean-machine smokes, and assembles the asset set and
# latest.json into a short-lived workflow artifact. It never creates or changes a release, a draft, a
# tag or an attestation: `draft`, `attach`, `attest`, `verify-draft` and `publish` run only for the
# `closed` event of a merged promotion. `checks` and `e2e` are skipped in it, because ci.yml and e2e.yml
# already run on the pull request as workflows of their own.
#
# What the jobs run for each event (P = promotion pull request, development into main, same repository):
#   P opened, pushed to, reopened: prepare, build (build only), both smokes, dry-run-assemble.
#   P closed and merged: checks, e2e, prepare, draft, build (attaches), both smokes, attach, attest,
#                        verify-draft, publish.
#   P closed unmerged, or any other pull request into main: every job is skipped.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

# Runs of merged promotions share one group, so they run one after another and two merges cannot
# compute the same version from the same tags. GitHub keeps one pending run per group: of several
# quick merges the middle pending run is cancelled, and its changes ship with the next release. A dry
# run has a group per pull request and a newer push cancels the older dry run (it is only a check, and
# it never touches the release group). A pull request closed without a merge gets its own group, so it
# never cancels a real release run.
concurrency:
  group: >-
    ${{ github.event.action != 'closed' && format('release-dry-run-{0}', github.event.pull_request.number)
    || github.event.pull_request.merged == true && 'release'
    || format('skip-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

defaults:
  run:
    shell: bash

env:
  # The commit that every job checks out and asserts. A real release uses the merge commit on main. A dry
  # run uses the commit of the pull request's merge ref (github.sha on these events). The first
  # expression is never empty on a dry run, and a closed event falls through to merge_commit_sha, so a
  # missing merge commit still fails the commit-id check instead of building something else.
  MERGE_SHA: ${{ github.event.action != 'closed' && github.sha || github.event.pull_request.merge_commit_sha }}
  RELEASE_OUT: release-out

jobs:
  # 1. Every CI and E2E gate on the merge commit. ci.yml and e2e.yml declare `workflow_call` with the
  #    input `release-call`, which runs the full set there. Both skip the work when the promotion pull
  #    request already passed them on this exact tree. Skipped in the dry run (merged is false there):
  #    ci.yml and e2e.yml run on the open pull request as their own workflows.
  checks:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml
    # The called workflow cannot hold more than its caller grants: its `changes` job reads the
    # Actions cache list to find the passed marker of this tree, and the pull request that saved it.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      release-call: true

  # The end-to-end suite on the merge commit, on Linux and Windows (tauri-driver has no macOS driver),
  # called like `checks`.
  e2e:
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/e2e.yml
    # Same reason as `checks`: the called `changes` job reads the Actions cache list.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    with:
      release-call: true

  # 2. Read-only: checks out MERGE_SHA with every tag, asserts HEAD and computes the version. The merge
  #    ref of an open promotion has main as a parent, so the check that the newest stable tag is an
  #    ancestor holds there too (with no tag at all it is skipped), and the version is the one the merge
  #    will get. A real release needs `checks` and `e2e` to have succeeded: a skipped one does not pass.
  #    The dry run needs neither, and the same-repository development-to-main test keeps every other
  #    pull request out.
  prepare:
    needs: [checks, e2e]
    if: >-
      ${{ !cancelled()
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.action != 'closed'
      || (github.event.pull_request.merged == true
      && needs.checks.result == 'success'
      && needs.e2e.result == 'success')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check that HEAD is the merge commit
        run: python -I scripts/release/release.py check-checkout --merge-sha "$MERGE_SHA"
      - name: Compute the version from the tags (the three fields must agree)
        id: resolve
        run: python -I scripts/release/release.py next-version --merge-sha "$MERGE_SHA"
      - name: Refuse the updater public key placeholder
        run: python -I scripts/release/release.py check-updater-config

  # 3. The only write step that creates the draft. The build legs attach to it by ID. Never in the dry run.
  draft:
    needs: prepare
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Tag precheck, prune stale Windows installers, create or reuse the single draft
        id: draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: >-
          python -I scripts/release/release.py draft
          --repo "$GITHUB_REPOSITORY" --merge-sha "$MERGE_SHA"
          --version "$VERSION" --previous-tag "$PREVIOUS_TAG"

  # 4. Builds, one leg per platform. On Windows and Linux tauri-action attaches to the draft; the token is
  #    passed to that step only, next to the updater signing key. The NSIS installer (Windows, not
  #    code-signed) and the AppImage and deb (Linux, x86-64) are built; the NSIS installer and the AppImage
  #    also get an updater signature. The macOS leg (Apple Silicon) builds the app and the DMG with
  #    scripts/release/macos_build.sh, which never sees the token: it signs with Developer ID and
  #    notarizes when the Apple secrets exist, and signs ad-hoc otherwise. The app archive gets an updater
  #    signature. The `attach` job uploads the macOS files. latest.json is written later by the `attach` job.
  #    In the dry run `draft` is skipped (a real release needs it to have succeeded), tauri-action gets
  #    neither a release ID nor a tag and so only builds, and no step holds the GitHub token or an Apple
  #    secret. The legs do not cancel each other (`fail-fast: false`): a failure in one leg must not hide
  #    the failures of the others, and nothing publishes unless every leg succeeded.
  build:
    needs: [prepare, draft]
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && (needs.draft.result == 'success'
      || (github.event.action != 'closed' && needs.draft.result == 'skipped')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            pdfium: windows-x64
            bundles: nsis
            library: pdfium.dll
          # Not the latest LTS like the other jobs: the build host sets the glibc floor of the
          # AppImage and deb, so 24.04 keeps them running on Ubuntu 24.04 and newer.
          - os: ubuntu-24.04
            platform: linux-x64
            pdfium: linux-x64
            bundles: appimage,deb
            library: libpdfium.so
          # Apple Silicon only (the runner is arm64; the leg checks it).
          - os: macos-latest
            platform: macos-arm64
            pdfium: mac-arm64
            bundles: app,dmg
            library: libpdfium.dylib
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # Write access is for tauri-action's upload to the draft. A permission cannot depend on the event, so
    # the dry run holds it too, but no step of the dry run is given the token.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      PLATFORM: ${{ matrix.platform }}
      PDFIUM_PLATFORM: ${{ matrix.pdfium }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check the macOS runner is Apple Silicon
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Linux system packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check that HEAD is the merge commit
        run: python -I scripts/release/release.py check-checkout --merge-sha "$MERGE_SHA"
      # The files hold the version of the last manual bump; every build below (and the tools that read the
      # files, such as `tauri build`, cargo and the notices) must see the computed one.
      - name: Stamp the computed version into the checkout (not committed)
        run: python -I scripts/release/release.py set-version "$VERSION"
      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install the locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show
      - name: Fetch the pinned PDFium binaries (every release platform, for the notices)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-pdfium.sh all
      - name: Fetch the pinned PDFium binaries (every release platform, for the notices)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-pdfium.ps1 -Platform all
      # Prebuilt and checksum-verified by install-action, with no fallback to a source build: compiling
      # them took 4 to 11 minutes per leg. The cargo-about binary only exists with its `cli` feature, and
      # `binary-scanning` is a default feature of cargo-audit, so the prebuilt binaries have both.
      - name: Install the release tools (prebuilt, versions pinned)
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2,cargo-cyclonedx@0.5.9,cargo-audit@0.22.1
          fallback: none
      # This install-action release has no cargo-auditable 0.7.7 build, so it is built from source.
      - name: Install cargo-auditable (versions pinned)
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/tools"
          cargo install --locked --root "$TOOLS" --version 0.7.7 cargo-auditable
          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          # tauri-action runs `tauri build`, which runs `cargo build` directly, so `cargo auditable` is not
          # used there. Cargo's workspace wrapper hook does the same job: cargo-auditable answers as the
          # rustc wrapper when RUSTC_WORKSPACE_WRAPPER names it (see the tauri-action step below).
          SUFFIX=""
          if [ "$RUNNER_OS" = "Windows" ]; then SUFFIX=".exe"; fi
          echo "JOBNIAC_AUDITABLE_WRAPPER=$TOOLS/bin/cargo-auditable$SUFFIX" >> "$GITHUB_ENV"
      - name: Frontend build (the desktop crate embeds it)
        run: pnpm build
      - name: Licence notices (cargo-about, pnpm licences, static components)
        run: >-
          python -I scripts/release/release.py notices
          --out-dir src-tauri/resources
          --pdfium-dir vendor/pdfium/windows-x64
          --pdfium-dir vendor/pdfium/linux-x64
          --pdfium-dir vendor/pdfium/mac-arm64
      - name: Build the CLI with cargo auditable and stage the sidecar
        run: |
          set -euo pipefail
          cargo auditable build --release --locked -p jobniac-cli
          python -I scripts/release/release.py stage-sidecar --target-dir target/release --binaries-dir src-tauri/binaries
      # With a release ID or a tag name tauri-action uploads what it built; with neither it only builds
      # ("No releaseId or tagName provided, skipping all uploads", src/index.ts at the pinned commit), and
      # it reads the token only inside the release calls. The dry run (any event but `closed`) passes
      # neither and no token, so it cannot reach the draft. The updater signing key is the real one in
      # both: only a same-repository promotion pull request from the protected development branch gets
      # it, and a build that signs with it is what proves that the secret matches the public key.
      - name: Build, and attach the draft assets on a real release (tauri-action, the only step with the token)
        if: runner.os != 'macOS'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.event.action == 'closed' && secrets.GITHUB_TOKEN || '' }}
          # Makes the desktop binary auditable: cargo-auditable is the workspace rustc wrapper for this build.
          RUSTC_WORKSPACE_WRAPPER: ${{ env.JOBNIAC_AUDITABLE_WRAPPER }}
          CARGO_AUDITABLE_ORIG_ARGS: '{"config":[],"offline":false,"locked":true,"frozen":false}'
          # The updater signing key (tauri signer generate). Only this step can read it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ github.event.action == 'closed' && env.TAG || '' }}
          releaseId: ${{ github.event.action == 'closed' && needs.draft.outputs.release_id || '' }}
          releaseDraft: true
          prerelease: ${{ env.PRERELEASE == 'true' }}
          # latest.json and the updater signatures are attached by the `attach` job (two legs would race
          # to merge latest.json here, and tauri-action would also upload a .deb.sig that is not a
          # release asset). tauri-action v1 ignores unknown inputs with a warning only.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
      # The macOS build. The Apple secrets are passed to this step only (never to tauri-action, which
      # holds the GitHub token, and never echoed). The release runs only for a merged promotion pull
      # request of this repository, so a fork's pull request never reaches it. Without the secrets the
      # script builds an ad-hoc signed app; with them it signs with Developer ID and notarizes. The dry run
      # (any event but `closed`) passes no Apple secret, so it always builds ad-hoc: it checks the build
      # and the smoke test, not the signing and notarization, which only a real release exercises. The
      # updater key is passed in both, as for the other legs.
      - name: Build the macOS bundles (Developer ID signing and notarization on a real release when the secrets exist)
        if: runner.os == 'macOS' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BUNDLES: ${{ matrix.bundles }}
          # Opt-in, exactly `1`: an ad-hoc macOS build then fails the release instead of warning. Not in the
          # dry run, which builds ad-hoc by design.
          MACOS_SIGNING_REQUIRED: ${{ github.event.action == 'closed' && vars.MACOS_SIGNING_REQUIRED || '' }}
          RUSTC_WORKSPACE_WRAPPER: ${{ env.JOBNIAC_AUDITABLE_WRAPPER }}
          CARGO_AUDITABLE_ORIG_ARGS: '{"config":[],"offline":false,"locked":true,"frozen":false}'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ github.event.action == 'closed' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event.action == 'closed' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event.action == 'closed' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ github.event.action == 'closed' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ github.event.action == 'closed' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_PRIVATE_KEY: ${{ github.event.action == 'closed' && secrets.APPLE_API_PRIVATE_KEY || '' }}
          APPLE_ID: ${{ github.event.action == 'closed' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event.action == 'closed' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event.action == 'closed' && secrets.APPLE_TEAM_ID || '' }}
        run: bash scripts/release/macos_build.sh
      - name: Audit the built binaries (embedded cargo-auditable data is required)
        run: |
          set -euo pipefail
          SUFFIX=""
          if [ "$RUNNER_OS" = "Windows" ]; then SUFFIX=".exe"; fi
          LOG="$RUNNER_TEMP/cargo-audit-bin.log"
          for bin in "target/release/jobniac$SUFFIX" "target/release/jobniac-cli$SUFFIX"; do
            cargo audit bin "$bin" 2>&1 | tee -a "$LOG"
          done
          # cargo audit bin only warns when the data is missing (the message wraps inside 'cargo auditable'),
          # so the warning is the gate.
          if grep -Fq "was not built with '" "$LOG"; then
            echo "::error::a built binary has no cargo-auditable data" >&2
            exit 1
          fi
      - name: Stage the payload and reconcile it with the notices
        run: |
          set -euo pipefail
          SUFFIX=""
          if [ "$RUNNER_OS" = "Windows" ]; then SUFFIX=".exe"; fi
          mkdir -p "$RELEASE_OUT"
          python -I scripts/release/release.py stage-payload \
            --target-dir target/release --platform "$PLATFORM" \
            --pdfium-library "vendor/pdfium/$PDFIUM_PLATFORM/${{ matrix.library }}" \
            --notices src-tauri/resources/THIRD-PARTY-NOTICES.txt \
            --out "$RUNNER_TEMP/payload"
          python -I scripts/release/release.py inventory \
            --payload "$RUNNER_TEMP/payload" \
            --notices-manifest src-tauri/resources/notices-manifest.json \
            --out "$RELEASE_OUT/JobniacFast-$VERSION-$PLATFORM.payload-inventory.json"
      - name: Software bill of materials (Linux leg only; recomputed and compared byte for byte)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          SBOM="$RUNNER_TEMP/sbom"
          mkdir -p "$SBOM/first" "$SBOM/second"
          for run in first second; do
            cargo cyclonedx --format json --spec-version 1.5 --target all --all --manifest-path src-tauri/Cargo.toml -q
            mv src-tauri/jobniac-desktop.cdx.json "$SBOM/$run/desktop.cdx.json"
            cargo cyclonedx --format json --spec-version 1.5 --target all --all --manifest-path crates/cli/Cargo.toml -q
            mv crates/cli/jobniac-cli.cdx.json "$SBOM/$run/cli.cdx.json"
            pnpm sbom --sbom-format cyclonedx --sbom-spec-version 1.5 --prod --out "$SBOM/$run/npm.cdx.json"
          done
          for role in desktop cli; do
            python -I scripts/release/release.py normalize-sbom --in "$SBOM/first/$role.cdx.json" --out "$SBOM/first/$role.norm.json" --seed "v$VERSION|$MERGE_SHA|$role"
            python -I scripts/release/release.py normalize-sbom --in "$SBOM/second/$role.cdx.json" --out "$SBOM/second/$role.norm.json" --seed "v$VERSION|$MERGE_SHA|$role"
            cmp "$SBOM/first/$role.norm.json" "$SBOM/second/$role.norm.json"
            cp "$SBOM/first/$role.norm.json" "$RELEASE_OUT/JobniacFast-$VERSION-$role.cargo.cdx.json"
          done
          python -I scripts/release/release.py normalize-sbom --in "$SBOM/first/npm.cdx.json" --out "$SBOM/first/npm.norm.json" --seed "v$VERSION|$MERGE_SHA|npm"
          python -I scripts/release/release.py normalize-sbom --in "$SBOM/second/npm.cdx.json" --out "$SBOM/second/npm.norm.json" --seed "v$VERSION|$MERGE_SHA|npm"
          cmp "$SBOM/first/npm.norm.json" "$SBOM/second/npm.norm.json"
          cp "$SBOM/first/npm.norm.json" "$RELEASE_OUT/JobniacFast-$VERSION.npm.cdx.json"
      - name: Collect the installer, the notices and the leg digests
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_OUT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/release/bundle/nsis/JobniacFast_${VERSION}_x64-setup.exe" "$RELEASE_OUT/"
            cp "target/release/bundle/nsis/JobniacFast_${VERSION}_x64-setup.exe.sig" "$RELEASE_OUT/"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp "target/release/bundle/dmg/JobniacFast_${VERSION}_aarch64.dmg" "$RELEASE_OUT/"
            # Tauri names the updater archive JobniacFast.app.tar.gz, with no version or architecture. The
            # signature covers the bytes of the archive, so renaming both keeps it valid.
            cp "target/release/bundle/macos/JobniacFast.app.tar.gz" "$RELEASE_OUT/JobniacFast_${VERSION}_aarch64.app.tar.gz"
            cp "target/release/bundle/macos/JobniacFast.app.tar.gz.sig" "$RELEASE_OUT/JobniacFast_${VERSION}_aarch64.app.tar.gz.sig"
          else
            cp "target/release/bundle/appimage/JobniacFast_${VERSION}_amd64.AppImage" "$RELEASE_OUT/"
            cp "target/release/bundle/appimage/JobniacFast_${VERSION}_amd64.AppImage.sig" "$RELEASE_OUT/"
            cp "target/release/bundle/deb/JobniacFast_${VERSION}_amd64.deb" "$RELEASE_OUT/"
          fi
          cp src-tauri/resources/THIRD-PARTY-NOTICES.txt "$RELEASE_OUT/"
          python -I scripts/release/release.py leg-digests --dir "$RELEASE_OUT"
      # The Windows and macOS installers get a clean-machine job; the Linux packages get this check that
      # the CLI they ship runs (a sidecar copied without its mode bits once shipped as 0644).
      - name: The deb and the AppImage ship a runnable CLI
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          OUT="$PWD/$RELEASE_OUT"
          dpkg-deb -x "$OUT/JobniacFast_${VERSION}_amd64.deb" "$RUNNER_TEMP/deb-root"
          "$RUNNER_TEMP/deb-root/usr/bin/jobniac-cli" --version | grep -Fq "$VERSION"
          # The app in the deb embeds the updater public key of the release config, exactly once.
          python -I scripts/release/release.py check-binary-pubkey --binary "$RUNNER_TEMP/deb-root/usr/bin/jobniac"
          cd "$RUNNER_TEMP"
          "$OUT/JobniacFast_${VERSION}_amd64.AppImage" --appimage-extract >/dev/null
          squashfs-root/usr/bin/jobniac-cli --version | grep -Fq "$VERSION"
      - name: Upload the leg artifacts (workflow artifacts, not the draft)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.RELEASE_OUT }}/*
          if-no-files-found: error
          # A dry run's legs are never released, so they expire with its dry-run-assets artifact.
          retention-days: ${{ github.event.action == 'closed' && 30 || 3 }}

  # 5. Installs the Windows installer on a fresh runner, from the workflow artifact, before attach. It runs
  #    when every leg succeeded and also when one failed, so that a failed Linux leg does not hide a
  #    smoke failure on the legs that did build (a failed Windows leg leaves no artifact, so this job then
  #    fails on the download). `attach` and `publish` still need every leg to have succeeded.
  clean-machine:
    needs: [prepare, build]
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-windows-x64
          path: legs/windows-x64
      - name: Install, launch, exercise MCP, uninstall and check residue
        run: >-
          python -I scripts/release/clean_machine_smoke.py
          --installer "legs/windows-x64/JobniacFast_${VERSION}_x64-setup.exe"
          --leg-digests legs/windows-x64/leg-digests.txt
          --inventory "legs/windows-x64/JobniacFast-${VERSION}-windows-x64.payload-inventory.json"
          --version "$VERSION"
          --work "$RUNNER_TEMP/clean-machine"

  # 5b. Opens the macOS DMG and the updater archive on a fresh runner, from the workflow artifact, before
  #     attach: bundle layout, signature (Developer ID builds also Gatekeeper and the stapled ticket), GUI
  #     launch, CLI, MCP, and a PDF extraction through the bundled worker and the bundled PDFium. It runs
  #     under the same condition as `clean-machine`. The dry run builds ad-hoc, so only a real release
  #     can require a Developer ID signature.
  clean-machine-macos:
    needs: [prepare, build]
    if: >-
      ${{ !cancelled()
      && needs.prepare.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'failure') }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macos-arm64
          path: legs/macos-arm64
      - name: Mount, launch, exercise MCP and the PDF worker
        run: >-
          python -I scripts/release/macos_smoke.py
          --dmg "legs/macos-arm64/JobniacFast_${VERSION}_aarch64.dmg"
          --archive "legs/macos-arm64/JobniacFast_${VERSION}_aarch64.app.tar.gz"
          --leg-digests legs/macos-arm64/leg-digests.txt
          --pdf-fixture crates/infra/tests/fixtures/pdf/corpus/resume-simple.pdf
          --version "$VERSION"
          ${{ github.event.action == 'closed' && vars.MACOS_SIGNING_REQUIRED == '1' && '--require-developer-id' || '' }}
          --work "$RUNNER_TEMP/macos-smoke"

  # 5c. The dry run's stand-in for `attach` and `verify-draft`: the same assemble step (leg verification, the
  #     exact asset set, SHA256SUMS), the same latest.json writer and the same manifest check, all on local
  #     files, with nothing uploaded to a release. The assembled files go to a workflow artifact that
  #     expires after three days. Its name must not match `release-*`, the pattern of the leg artifacts that
  #     `attach` and this job download. It runs when every leg built, whatever the smokes said.
  dry-run-assemble:
    needs: [prepare, build, clean-machine, clean-machine-macos]
    if: >-
      ${{ !cancelled()
      && github.event.action != 'closed'
      && needs.prepare.result == 'success'
      && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: legs
      - name: Assemble the asset set and write SHA256SUMS (write, then verify)
        run: python -I scripts/release/release.py assemble --legs legs --out release-assets --version "$VERSION"
      - name: Write latest.json and check it like verify-draft does (nothing is uploaded)
        run: |
          set -euo pipefail
          echo "Dry run on a promotion pull request." > release-notes.md
          python -I scripts/release/release.py updater-manifest --version "$VERSION" --dir release-assets \
            --out updater-manifest/latest.json --notes-file release-notes.md
          python -I scripts/release/release.py check-updater-manifest --version "$VERSION" --dir release-assets \
            --latest-json updater-manifest/latest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run-assets
          path: |
            release-assets/*
            updater-manifest/latest.json
          if-no-files-found: error
          retention-days: 3

  # 6. Verifies the legs, assembles the exact asset set, writes SHA256SUMS and attaches what the draft lacks.
  #    Never in the dry run: it writes to the draft.
  attach:
    needs: [prepare, draft, build, clean-machine, clean-machine-macos]
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_ID: ${{ needs.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: legs
      - name: Assemble the asset set and write SHA256SUMS (write, then verify)
        run: python -I scripts/release/release.py assemble --legs legs --out release-assets --version "$VERSION"
      - name: Attach the missing assets to the draft (same name and digest only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -I scripts/release/release.py attach
          --repo "$GITHUB_REPOSITORY" --release-id "${{ needs.draft.outputs.release_id }}"
          --dir release-assets
      # latest.json is written once here, after both legs, so no two legs race to merge it. A rerun
      # deletes the old one (prepare_draft), so the new pub_date never conflicts.
      # The notes are the draft's body (the changelog section or GitHub's generated notes), so latest.json
      # and the release page say the same.
      - name: Write latest.json from the assembled installers and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body > release-notes.md
          python -I scripts/release/release.py updater-manifest --version "$VERSION" --dir release-assets \
            --out updater-manifest/latest.json --notes-file release-notes.md
      - name: Attach latest.json to the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -I scripts/release/release.py attach
          --repo "$GITHUB_REPOSITORY" --release-id "${{ needs.draft.outputs.release_id }}"
          --dir updater-manifest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  # 7. Build provenance, only for a public repository (GitHub refuses it for user-owned private ones).
  #    The permissions sit on this job because a job cannot grant them conditionally. Never in the dry run:
  #    provenance of an unreleased build would be public.
  attest:
    needs: [attach]
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.repository.visibility == 'public'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

  # 8. Final API check of the draft: tag peel, flags, target commit, exact asset set and digests, and
  #    the updater manifest (latest.json) that `attach` wrote: this version, and per platform this
  #    release's installer and its signature. Never in the dry run (`dry-run-assemble` runs the manifest check).
  verify-draft:
    needs: [prepare, draft, attach]
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Download latest.json from the draft (a draft has no public download URL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          ASSET_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '[.assets[] | select(.name == "latest.json") | .id] | first')"
          if [ -z "$ASSET_ID" ] || [ "$ASSET_ID" = "null" ]; then
            echo "::error::the draft has no latest.json" >&2
            exit 1
          fi
          mkdir -p updater-manifest
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" > updater-manifest/latest.json
      - name: Verify the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: >-
          python -I scripts/release/release.py verify-draft
          --repo "$GITHUB_REPOSITORY" --merge-sha "$MERGE_SHA" --dir release-assets
          --version "$VERSION" --release-id "$RELEASE_ID"
          --latest-json updater-manifest/latest.json

  # 9. The only job that publishes. It runs after every other job has passed (the provenance job only
  #    when it runs at all, in a public repository). It tags the merge commit (a tag that already exists
  #    must be on that exact commit) and publishes the verified draft: the latest release for a stable
  #    version, a prerelease for -dev.N. The permission sits on this job only. It can run only for the
  #    `closed` event of a merged promotion; a dry run never gets here.
  publish:
    needs: [prepare, draft, build, clean-machine, clean-machine-macos, attach, attest, verify-draft]
    if: >-
      ${{ !cancelled()
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.ref == 'development'
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.prepare.result == 'success'
      && needs.draft.result == 'success'
      && needs.build.result == 'success'
      && needs.clean-machine.result == 'success'
      && needs.clean-machine-macos.result == 'success'
      && needs.attach.result == 'success'
      && needs.verify-draft.result == 'success'
      && (needs.attest.result == 'success' || needs.attest.result == 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.MERGE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Tag the merge commit and publish the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: >-
          python -I scripts/release/release.py publish
          --repo "$GITHUB_REPOSITORY" --merge-sha "$MERGE_SHA"
          --version "$VERSION" --release-id "$RELEASE_ID"
