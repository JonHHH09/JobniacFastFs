name: CI

# Reusable: release.yml calls this workflow (job `checks`) on the merge commit of a promotion pull
# request with `release-call: true`, which runs the full set, Windows included.
#
# Cost control (see docs/ops/branch-protection.md):
#   - the `changes` job path-filters pull requests into development (a docs-only change skips Rust
#     and UI) and skips everything when this exact source tree already passed on a trusted run;
#   - a promotion pull request (development into main) and the release call run everything, with
#     Windows; the Windows Rust job does not run on other pull requests;
#   - the `mark-passed` job records a fully green run, keyed by the git tree SHA. Runs that save a
#     marker: pushes to development, the nightly dispatch of nightly.yml (a run on development, so
#     its Rust caches are development-scoped and every pull request into development restores
#     them) and a promotion pull request (its marker is scoped to the pull request ref, which the
#     gate accepts after checking the pull request through the API). There is no push run for main:
#     the promotion merge is tested by the pull request and by the release call.
#   - pull requests restore the Rust caches but never save them (`save-if`).
# Skipped jobs report as skipped, which a required status check treats as passed. That is why the Rust
# job is two plain jobs with literal names instead of a matrix (a skipped matrix job reports its
# unexpanded name and would leave `Rust (ubuntu-26.04)` pending forever).

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-call:
        description: "Called by release.yml on the promotion merge commit: test that commit and run the full set."
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes and the release call (a merged pull request) never cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged != true }}

env:
  CARGO_TERM_COLOR: always
  # Faster compile and link; backtraces keep function names, only line numbers are dropped.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions cache list for the passed marker (scripts/ci/gate.sh).
      actions: read
      # Reads a pull request to verify a promotion pull request marker (scripts/ci/gate.sh).
      pull-requests: read
    outputs:
      tree: ${{ steps.gate.outputs.tree }}
      already-passed: ${{ steps.gate.outputs.already-passed }}
      rust: ${{ steps.gate.outputs.rust }}
      ui: ${{ steps.gate.outputs.ui }}
      windows: ${{ steps.gate.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request checks out the merge commit; depth 2 reaches its first parent (the base).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - name: Decide which jobs run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # The gate's name for the release call: a full run, no path filtering.
          RELEASE_CALL: ${{ inputs.release-call }}
        run: bash scripts/ci/gate.sh ci

  ui:
    name: UI
    needs: changes
    # Fail open: when the gate itself did not succeed, run (a skipped required check counts as passed).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # The two Rust jobs share their steps through a local composite action.
  rust-linux:
    name: Rust (ubuntu-26.04)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/rust-checks

  rust-windows:
    name: Rust (windows-latest)
    needs: changes
    # Not on pull requests: the gate turns `windows` off for them (a failed gate runs it anyway).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || (needs.changes.outputs.windows == 'true' && needs.changes.outputs.rust == 'true')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/rust-checks

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - name: cargo deny check (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  release-tools:
    name: Release tool unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      # The same interpreter as release.yml, which runs the tools under test.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Unit tests of scripts/release
        run: python -I -m unittest discover -s scripts/release/tests -p "test_*.py"

  privacy-scan:
    name: Privacy scan (working tree and history, generic classes)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - name: Unit tests of the privacy scanner
        run: python3 -I -m unittest discover -s scripts/ci/tests -p "test_*.py"
      - name: Scan the working tree and every reachable ref
        # Owner-specific classes and personal phrase fingerprints are local-only (gitignored inputs), so CI
        # runs the generic classes. The scan fails on any finding that is not in the reviewed allow-list.
        run: python3 -I scripts/ci/privacy_scan.py --mode all

  # Records that this tree passed the whole workflow, so the same tree is not tested again on the way
  # to main (the promotion pull request and the release call look it up). Saved by pushes and
  # dispatches on development or main (the cache is then scoped to that branch) and by a promotion
  # pull request (scoped to refs/pull/<n>/merge, which the gate verifies through the API). Never by
  # the release call, which has the same event and the same tree as the promotion pull request.
  # `success()` is false when a needed job was skipped, so a marker always means that every job ran
  # and passed, Windows included.
  mark-passed:
    name: Mark tree as passed
    needs: [changes, ui, rust-linux, rust-windows, supply-chain, release-tools, privacy-scan]
    if: >-
      ${{ success()
      && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'pull_request' && !inputs.release-call
      && github.base_ref == 'main' && github.head_ref == 'development'
      && github.event.pull_request.head.repo.full_name == github.repository))
      && needs.changes.outputs.already-passed != 'true'
      && needs.ui.result == 'success'
      && needs.rust-linux.result == 'success'
      && needs.rust-windows.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Write the marker file
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" > passed-marker
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: passed-marker
          key: ci-passed-${{ needs.changes.outputs.tree }}
