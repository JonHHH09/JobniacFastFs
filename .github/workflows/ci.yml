name: CI

# Reusable: release.yml calls this workflow (job `checks`) on the merge commit of a promotion pull
# request with `release-call: true`, which runs the full set, Windows included. Its `scope` input
# (all, shared, linux, macos, windows) turns every job outside the scope off; empty means all.
#
# Cost control (see docs/ops/branch-protection.md):
#   - the `changes` job (scripts/ci/gate.sh) path-filters plain pull requests by change class
#     (scripts/ci/change_classes.toml): a docs-only change runs no heavy job, a Rust change skips the
#     UI job. Plain means neither the release call nor a promotion pull request (development into
#     main, same repository); a pull request into main from any other branch is plain too;
#   - pushes, manual runs, promotion pull requests and the release call run the full set, Windows
#     included. Windows also runs on plain pull requests, when their change classes need it;
#   - each heavy job (UI and the three Rust jobs) is skipped when this exact source tree already
#     passed it on a trusted run: a per-job marker keyed by the git tree SHA. The `mark-passed` job
#     saves the marker of every heavy job that ran and succeeded, on: pushes to development, the
#     nightly dispatch of nightly.yml (a run on development, so its Rust caches are development-scoped
#     and every pull request into development restores them) and a promotion pull request (its
#     marker is scoped to the pull request ref, which the gate accepts after checking the pull
#     request through the API). There is no push run for main: the promotion merge is tested by the
#     pull request and by the release call. A manual run ignores markers;
#   - pull requests restore the Rust caches but never save them (`save-if`).
# `CI result (shared)` and `CI result (platforms)` are the required checks: they always run and fail
# unless every job they need succeeded or was skipped (a required check counts "skipped" as passed, so
# they must never be skipped themselves). The jobs are plain jobs with literal names instead of a
# matrix (a skipped matrix job reports its unexpanded name).

on:
  pull_request:
  push:
    branches: [development]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-call:
        description: "Called by release.yml on the promotion merge commit: test that commit and run the full set."
        type: boolean
        default: false
      scope:
        description: "Which jobs the release call runs: all, shared (UI, supply chain, release tools, privacy scan), linux, macos or windows. Empty means all."
        type: string
        default: all

permissions:
  contents: read

# Pull requests cancel superseded runs. Pushes and the release call (a merged pull request) never cancel.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged != true }}

env:
  CARGO_TERM_COLOR: always
  # Faster compile and link; backtraces keep function names, only line numbers are dropped.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Reads the Actions cache list for the passed marker (scripts/ci/gate.sh).
      actions: read
      # Reads a pull request to verify a promotion pull request marker (scripts/ci/gate.sh).
      pull-requests: read
    outputs:
      tree: ${{ steps.gate.outputs.tree }}
      ui: ${{ steps.gate.outputs.ui }}
      rust-linux: ${{ steps.gate.outputs.rust-linux }}
      rust-macos: ${{ steps.gate.outputs.rust-macos }}
      rust-windows: ${{ steps.gate.outputs.rust-windows }}
      supply-chain: ${{ steps.gate.outputs.supply-chain }}
      release-tools: ${{ steps.gate.outputs.release-tools }}
      privacy-scan: ${{ steps.gate.outputs.privacy-scan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pull request checks out the merge commit; depth 2 reaches its first parent (the base).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - name: Decide which jobs run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # With BASE_REF and the repository, tells a promotion pull request from a plain one.
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # The gate's name for the release call: a full run, no path filtering.
          RELEASE_CALL: ${{ inputs.release-call }}
          SCOPE: ${{ inputs.scope }}
        run: bash scripts/ci/gate.sh ci

  ui:
    name: UI
    needs: changes
    # Fail open: when the gate itself did not succeed, run (a skipped required check counts as passed).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Install pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint and format check
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # Bounds the apt calls that `--with-deps` makes below.
      - uses: ./.github/actions/apt-config
      # The React app in Chromium against the mock IPC (playwright/README.md); no Rust core involved.
      - name: Install Chromium for the browser UI suite
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser UI suite
        run: pnpm test:ui
      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright/.artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # The Rust jobs share their steps through a local composite action.
  rust-linux:
    name: Rust (ubuntu-26.04)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust-linux == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/rust-checks

  rust-windows:
    name: Rust (windows-latest)
    needs: changes
    # Fail open, like the other heavy jobs.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust-windows == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/rust-checks

  # Like the Linux job, with its own passed marker: macOS (Apple Silicon) is a release platform. It
  # proves the macOS worker sandbox (Seatbelt profiles and the memory watch) and the macOS file
  # handling. It runs whenever the Rust job of Linux runs.
  rust-macos:
    name: Rust (macos-latest)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust-macos == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - uses: ./.github/actions/rust-checks

  supply-chain:
    name: Supply chain (cargo-deny)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.supply-chain == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - name: cargo deny check (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  release-tools:
    name: Release tool unit tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release-tools == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      # The same interpreter as release.yml, which runs the tools under test.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Unit tests of scripts/release
        run: python -I -m unittest discover -s scripts/release/tests -p "test_*.py"
      - name: Versions and changelog agree
        run: python -I scripts/release/release.py check-versions

  privacy-scan:
    name: Privacy scan (working tree and history, generic classes)
    needs: changes
    # Runs on every change; only the release-call scope can turn it off.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.privacy-scan == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The release call tests the merge commit that release.yml pins, not the default merge ref.
          ref: ${{ inputs.release-call && github.event.pull_request.merge_commit_sha || '' }}
          persist-credentials: false
      - name: Unit tests of the privacy scanner
        run: python3 -I -m unittest discover -s scripts/ci/tests -p "test_*.py"
      - name: Scan the working tree and every reachable ref
        # Owner-specific classes and personal phrase fingerprints are local-only (gitignored inputs), so CI
        # runs the generic classes. The scan fails on any finding that is not in the reviewed allow-list.
        run: python3 -I scripts/ci/privacy_scan.py --mode all

  # Smoke test of the pinned actions/cache action. `mark-passed` (which saves with it) is skipped on
  # plain pull requests, so a bump of the action would otherwise first run on a push to
  # development. This job saves and restores a synthetic file under a disposable key on every pull
  # request, then checks the restored content. It is not part of the gate: it is not in the needs of
  # `mark-passed`, not a required check, and it neither reads nor writes `ci-passed-*` or `e2e-passed-*`
  # (the key prefix is `smoke-cache-`, the restore is an exact match with no `restore-keys`). It needs
  # no checkout and no token permission (the cache service uses the runner's own credential). A pull
  # request cache is scoped to its own ref, and the entry (a few bytes) expires by itself.
  cache-smoke:
    name: Cache action smoke test
    if: ${{ github.event_name == 'pull_request' && !inputs.release-call }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    env:
      SMOKE_KEY: smoke-cache-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Write a synthetic file
        run: |
          set -euo pipefail
          case "$SMOKE_KEY" in
            ci-passed-* | e2e-passed-*) echo "::error::the smoke key must not look like a passed marker"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/cache-smoke"
          printf 'cache smoke %s %s\n' "$SMOKE_KEY" "$(date -u +%s)" > "$RUNNER_TEMP/cache-smoke/payload.txt"
          # The reference copy lives outside the cached directory.
          cp "$RUNNER_TEMP/cache-smoke/payload.txt" "$RUNNER_TEMP/cache-smoke-expected.txt"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache-smoke
          key: ${{ env.SMOKE_KEY }}
      - name: Remove the file, so that only a restore can bring it back
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/cache-smoke"
          test ! -e "$RUNNER_TEMP/cache-smoke/payload.txt"
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cache-smoke
          key: ${{ env.SMOKE_KEY }}
          fail-on-cache-miss: true
      - name: Assert the restored content
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = "true"
          test -f "$RUNNER_TEMP/cache-smoke/payload.txt"
          cmp "$RUNNER_TEMP/cache-smoke/payload.txt" "$RUNNER_TEMP/cache-smoke-expected.txt"
          echo "Restored content matches: $(cat "$RUNNER_TEMP/cache-smoke/payload.txt")"

  # Records which heavy jobs passed on this tree, so the same tree is not tested again on the way to
  # main (the promotion pull request and the release call look the markers up). One marker per job
  # (`ci-passed-<job>-<tree>`), saved for each heavy job that ran and succeeded in this run, so a red
  # Windows job does not block the green Linux and macOS markers. A job that was skipped (not needed,
  # or already marked) saves nothing. Saved by pushes and dispatches on development or main (the cache
  # is then scoped to that branch) and by a promotion pull request (scoped to refs/pull/<n>/merge,
  # which the gate verifies through the API). Never by the release call, which has the same event and
  # the same tree as the promotion pull request. A failed gate saves nothing: its jobs ran fail-open.
  # Supply chain, release tools and the privacy scan have no marker: they are cheap.
  mark-passed:
    name: Mark tree as passed
    needs: [changes, ui, rust-linux, rust-macos, rust-windows]
    if: >-
      ${{ !cancelled()
      && needs.changes.result == 'success'
      && (github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch'
      && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'))
      || (github.event_name == 'pull_request' && !inputs.release-call
      && github.base_ref == 'main' && github.head_ref == 'development'
      && github.event.pull_request.head.repo.full_name == github.repository))
      && (needs.ui.result == 'success'
      || needs.rust-linux.result == 'success'
      || needs.rust-macos.result == 'success'
      || needs.rust-windows.result == 'success') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Write the marker file
        env:
          TREE: ${{ needs.changes.outputs.tree }}
        run: echo "$TREE" > passed-marker
      - name: Save the marker of the UI job
        if: ${{ needs.ui.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passed-marker
          key: ci-passed-ui-${{ needs.changes.outputs.tree }}
      - name: Save the marker of the Linux Rust job
        if: ${{ needs.rust-linux.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passed-marker
          key: ci-passed-rust-linux-${{ needs.changes.outputs.tree }}
      - name: Save the marker of the macOS Rust job
        if: ${{ needs.rust-macos.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passed-marker
          key: ci-passed-rust-macos-${{ needs.changes.outputs.tree }}
      - name: Save the marker of the Windows Rust job
        if: ${{ needs.rust-windows.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: passed-marker
          key: ci-passed-rust-windows-${{ needs.changes.outputs.tree }}

  # The required checks. They run always (`always()`: a skipped required check counts as passed, so a
  # cancelled or failed dependency must never leave them skipped) and fail unless every needed job
  # succeeded or was skipped. A failed `changes` job fails them, although the heavy jobs then run
  # fail-open. No checkout: bash and jq are on the runner.
  result-shared:
    name: CI result (shared)
    needs: [changes, ui, supply-chain, release-tools, privacy-scan]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the results of the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "### CI result (shared)"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi

  result-platforms:
    name: CI result (platforms)
    needs: [changes, rust-linux, rust-macos, rust-windows]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check the results of the needed jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "### CI result (platforms)"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          bad="$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::not green: $bad"
            exit 1
          fi
