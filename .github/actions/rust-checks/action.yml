name: Rust checks
description: >-
  Builds the UI, fetches PDFium and runs format, clippy and the tests of the Rust workspace. Shared by
  the `Rust (ubuntu-26.04)`, `Rust (windows-latest)` and `Rust (macos-latest)` jobs of ci.yml. The caller checks out first.

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24
    - name: Install pnpm (version from package.json packageManager)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Build the UI (needed by tauri::generate_context!)
      shell: bash
      run: |
        pnpm install --frozen-lockfile
        pnpm build
    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch at the pinned commit
      with:
        toolchain: stable
        components: rustfmt, clippy
    - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        # Pull request caches are unreadable by other pull requests and fill the quota.
        save-if: ${{ github.event_name != 'pull_request' }}
    - name: Fetch the pinned PDFium library (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        bash scripts/fetch-pdfium.sh linux-x64
        echo "JOBNIAC_PDFIUM_DIR=$GITHUB_WORKSPACE/vendor/pdfium/linux-x64" >> "$GITHUB_ENV"
    - name: Fetch the pinned PDFium library (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        ./scripts/fetch-pdfium.ps1 -Platform windows-x64
        "JOBNIAC_PDFIUM_DIR=$env:GITHUB_WORKSPACE\vendor\pdfium\windows-x64" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Fetch the pinned PDFium library (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        bash scripts/fetch-pdfium.sh mac-arm64
        echo "JOBNIAC_PDFIUM_DIR=$GITHUB_WORKSPACE/vendor/pdfium/mac-arm64" >> "$GITHUB_ENV"
    - name: Confirm the PDFium library is visible to the tests (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: test -f "$JOBNIAC_PDFIUM_DIR/libpdfium.dylib"
    - name: Confirm the PDFium library is visible to the tests (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: test -f "$JOBNIAC_PDFIUM_DIR/libpdfium.so"
    - name: Confirm the PDFium library is visible to the tests (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not $env:JOBNIAC_PDFIUM_DIR) { throw 'JOBNIAC_PDFIUM_DIR was not exported to later steps' }
        if (-not (Test-Path -LiteralPath (Join-Path $env:JOBNIAC_PDFIUM_DIR 'pdfium.dll') -PathType Leaf)) { throw 'pdfium.dll is missing from JOBNIAC_PDFIUM_DIR' }
    - name: Format
      shell: bash
      run: cargo fmt --all --check
    - name: Clippy
      shell: bash
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Install cargo-nextest (prebuilt, checksum-verified)
      uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
      with:
        tool: cargo-nextest
    - name: Test
      # nextest runs the test binaries in parallel. It skips doctests; the workspace has none.
      shell: bash
      run: cargo nextest run --workspace --locked
    - name: Generated TypeScript bindings are up to date
      if: runner.os == 'Linux'
      shell: bash
      run: git diff --exit-code -- src/ipc/bindings.ts
