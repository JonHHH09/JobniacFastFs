name: End-to-end suite
description: >-
  Builds the debug desktop application and runs the WebDriver suite (e2e/README.md) over a temporary
  SQLite database file. Shared by the `E2E (ubuntu-26.04)` and `E2E (windows-latest)` jobs of e2e.yml.
  The caller checks out first.

inputs:
  platform:
    description: Runner label, used to name the failure screenshots artifact.
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies (Tauri, WebKitWebDriver, xvfb)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkitgtk-webdriver xvfb

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 24

    - name: Install pnpm (version from package.json packageManager)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The pinned toolchain only (rust-toolchain.toml). A separate `stable` would never build anything
    # here, and its version would enter the rust-cache key and change it whenever stable moves.
    - name: Rust toolchain from rust-toolchain.toml
      shell: bash
      run: |
        rustup toolchain install
        rustup show active-toolchain
    - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        # Pull request caches are unreadable by other pull requests and fill the quota.
        save-if: ${{ github.event_name != 'pull_request' }}

    - name: Fetch the pinned PDFium library (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: bash scripts/fetch-pdfium.sh linux-x64

    - name: Fetch the pinned PDFium library (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/fetch-pdfium.ps1 -Platform windows-x64

    - name: Build the debug desktop application (no bundle)
      shell: bash
      run: pnpm tauri build --debug --no-bundle --config src-tauri/tauri.e2e.conf.json

    - name: Build the console binary
      shell: bash
      run: cargo build --locked -p jobniac-cli

    - name: Install tauri-driver
      shell: bash
      run: cargo install tauri-driver --locked

    - name: Fetch the Microsoft Edge WebDriver matching the WebView2 runtime (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
        $version = (Get-ItemProperty -Path $key -Name pv -ErrorAction Stop).pv
        if (-not ($version -match '^\d+(\.\d+){3}$')) { throw 'the WebView2 runtime version is not readable' }
        $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
        New-Item -ItemType Directory -Force -Path $dir | Out-Null
        $zip = Join-Path $dir 'edgedriver_win64.zip'
        Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip -UseBasicParsing
        Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
        $driver = Join-Path $dir 'msedgedriver.exe'
        $signature = Get-AuthenticodeSignature -FilePath $driver
        if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
          throw 'msedgedriver.exe is not validly signed by Microsoft'
        }
        $installed = (& $driver --version) -replace '^.*?(\d+(\.\d+){3}).*$', '$1'
        if ($installed -ne $version) { throw "msedgedriver $installed does not match the WebView2 runtime $version" }
        $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

    - name: Run the end-to-end suite (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: node e2e/run.mjs

    - name: Run the end-to-end suite (Linux, under xvfb)
      if: runner.os == 'Linux'
      shell: bash
      run: xvfb-run --auto-servernum node e2e/run.mjs

    - name: Upload failure screenshots
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-screenshots-${{ inputs.platform }}
        path: e2e/.artifacts/
        if-no-files-found: ignore
        retention-days: 7
