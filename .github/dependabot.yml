version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      # The init, analyze and upload-sarif steps must run the same version, or the
      # CodeQL analyze step fails; one PR moves them together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
