# cargo-about policy for THIRD-PARTY-NOTICES (scripts/release/release.py notices).
# The accepted list mirrors the allow-list of deny.toml [licenses]; cargo-deny stays the licence gate.
# Build-only crates are not shipped, but they are kept in the notices when they are in the graph
# (uncertain cases are included).

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
]

targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

ignore-dev-dependencies = true
