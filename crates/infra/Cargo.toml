[package]
name = "jobniac-infra"
description = "SQLite, filesystem, worker and network adapters for Jobniac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# Outbound fetch worker (workers/fetch): DNS once per hop, TLS to validated addresses, system roots.
hickory-resolver.workspace = true
jobniac-core.workspace = true
jobniac-text.workspace = true
# Embedded SQLite (bundled): the local database.
rusqlite.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Worker child limits (setrlimit through a safe API) and the process-group kill (libc::killpg); on
# macOS also the Seatbelt sandbox and the memory read of the supervisor (workers/platform/macos*.rs).
rlimit.workspace = true
libc = "0.2"
# The PDF exporter's Linux and macOS publication (files/export/platform_*.rs) and the macOS pinned
# reads (files/no_follow.rs), all through the safe API.
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Worker child confinement: Landlock rules and a seccomp-BPF filter (workers/platform/linux_sandbox.rs).
landlock.workspace = true
seccompiler.workspace = true

[target.'cfg(windows)'.dependencies]
# Win32 Job Objects for worker isolation (workers/platform/windows.rs) and the handle information
# of pinned file reads (files/no_follow.rs, GetFileInformationByHandle).
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[features]
test-hooks = []
# Compiles the sandbox operation of the probe worker kind (test-only: it opens, creates, connects and
# executes on request). Release builds leave it off; the CLI tests turn it on.
worker-probe = []

[dev-dependencies]
jobniac-infra = { path = ".", features = ["test-hooks"] }
rcgen.workspace = true
tempfile.workspace = true

[lints]
workspace = true
