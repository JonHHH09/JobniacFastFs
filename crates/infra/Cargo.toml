[package]
name = "jobniac-infra"
description = "PostgreSQL, filesystem, worker and network adapters for Jobniac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
# Outbound fetch worker (workers/fetch): DNS once per hop, TLS to validated addresses, system roots.
hickory-resolver.workspace = true
jobniac-core.workspace = true
jobniac-text.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
secrecy.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-time-0_3", "with-uuid-1"] }
tokio-rustls.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Worker child limits (setrlimit through a safe API) and the process-group kill (libc::killpg).
rlimit.workspace = true
# Worker child confinement: Landlock rules and a seccomp-BPF filter (workers/platform/linux_sandbox.rs).
landlock.workspace = true
seccompiler.workspace = true
libc = "0.2"
# The PDF exporter's Linux publication (files/export/platform_linux.rs), through the safe API.
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
# Win32 Job Objects for worker isolation (workers/platform/windows.rs) and the handle information
# of pinned file reads (files/no_follow.rs, GetFileInformationByHandle).
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[features]
test-hooks = []
# Compiles the sandbox operation of the probe worker kind (test-only: it opens, creates, connects and
# executes on request). Release builds leave it off; the CLI tests turn it on.
worker-probe = []
# Gates the PostgreSQL test files that fail closed on CI without a server. The `rust` job leaves it
# off; the `postgres` job turns it on through pg-test.
postgres-tests = []

[dev-dependencies]
jobniac-testkit.workspace = true
jobniac-infra = { path = ".", features = ["test-hooks"] }
rcgen.workspace = true

[[test]]
name = "postgres_job_search"
required-features = ["test-hooks"]

[[test]]
name = "postgres_arbeitnow"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_artifacts"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_cleanup"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_deletion"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_generated"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_generated_classified"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_generated_links"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_generated_repository"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_german_cover_letter"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_german_resume"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_job_links"
required-features = ["postgres-tests"]

[[test]]
name = "postgres_documents_list"
required-features = ["postgres-tests"]

[lints]
workspace = true
